# The generate-coverage action writes its own default here when the file is
# absent: a 180 s per-test budget under a 10 min run budget. This file replaces
# that default so the two trybuild UI binaries, which compile whole crates and
# outlast 180 s on a cold, instrumented runner, get a budget that fits them.
#
# The ordering the contract in tests/test_timeout_ordering_contract.py holds:
# largest per-test budget < global-timeout < the 4,080 s cargo watchdog less
# termination and a cold build.
#
# The whole-run budget is sized for the serial pair, not for one test plus an
# observed prefix: the two UI binaries share a test group, so a run that is
# slow for both spends 2 x 1,500 s before either finishes. A 50-minute budget
# cancels the second one while neither test has reached its own allowance.
# Fifty-six minutes is that pair plus the six minutes of suite overhead and
# reporting the earlier sizing already allowed for.
# Fetch the locked dependencies once, before any test starts, so a nested
# Cargo build in a test (the trybuild binaries below) does not resolve them
# while holding the shared package-cache lock (the Concordat NC-008 rule). It
# lives here, not in each caller, because `make test` and every
# generate-coverage step run this profile. Setup scripts are experimental in
# the nextest versions the coverage action may install, so the configuration
# opts in; newer versions accept the entry.
experimental = ["setup-scripts"]

[scripts.setup.fetch-locked]
command = "cargo fetch --locked"

[[profile.default.scripts]]
filter = "all()"
setup = "fetch-locked"

[profile.default]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "56m"

# The two UI binaries use the same trybuild target-directory build lock.
[test-groups]
trybuild = { max-threads = 1 }

# stilyagi-ir's `ui` binary and stilyagi-pyext's `compile_tests` binary drive
# trybuild, which builds a scratch crate per case. They are the only tests whose
# duration is a compile rather than a computation.
[[profile.default.overrides]]
filter = "(package(stilyagi-ir) & binary(ui)) | (package(stilyagi-pyext) & binary(compile_tests))"
slow-timeout = { period = "1500s", terminate-after = 1, grace-period = "5s" }
test-group = "trybuild"
