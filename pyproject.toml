[project]
name = "stilyagi"
version = "0.1.0"
description = "Prose linter for Markdown and doc comments"
readme = "README.md"
requires-python = ">=3.14"
license = "ISC"
license-files = ["LICENSE"]
authors = [{ name = "Payton McIntosh", email = "pmcintosh@df12.net" }]
[project.urls]
Homepage = "https://df12.studio/stilyagi"
Documentation = "https://df12.studio/stilyagi/docs/"
Repository = "https://github.com/leynos/stilyagi"

[project.scripts]
stilyagi = "stilyagi.cli:main"
[dependency-groups]
dev = [
    # Keep in sync with [build-system].requires.
    "maturin==1.14.1",
    "pytest",
    "pytest-xdist",
    "cmd-mox==0.2.0",
    # Pin development lint dependencies so every local environment resolves
    # the same toolchain.
    "df12-python-lints @ git+https://github.com/leynos/df12-python-lints.git@v0.3.0",
    "interrogate==1.7.0",
    "ruff==0.16.8",
    "pytest-timeout",
    "pytest-bdd>=9.0.0,<10.0.0",
    "hypothesis>=6.168.0,<7.0",
    "parse_type",
    "syrupy>=6.1.1,<7.0",
    "pyyaml>=6.0.3,<7.0",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "ASYNC",
    "D",
    "DOC",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["assert", "unsafe-yaml-load", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"tests/steps/*.py" = ["assert", "unsafe-yaml-load", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-type-checking]
# Hypothesis introspects decorated test signatures at collection time.
runtime-evaluated-decorators = [
    "hypothesis.given",
    "pytest_bdd.given",
    "pytest_bdd.then",
    "pytest_bdd.when",
]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.AbstractSet".msg = "Use collections.abc.Set instead of deprecated typing generics."
"typing.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead of deprecated typing generics."
"typing.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead of deprecated typing generics."
"typing.AsyncIterable".msg = "Use collections.abc.AsyncIterable instead of deprecated typing generics."
"typing.AsyncIterator".msg = "Use collections.abc.AsyncIterator instead of deprecated typing generics."
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead of deprecated typing generics."
"typing.Callable".msg = "Use collections.abc.Callable instead of deprecated typing generics."
"typing.ChainMap".msg = "Use collections.ChainMap instead of deprecated typing generics."
"typing.Collection".msg = "Use collections.abc.Collection instead of deprecated typing generics."
"typing.Container".msg = "Use collections.abc.Container instead of deprecated typing generics."
"typing.ContextManager".msg = "Use contextlib.AbstractContextManager instead of deprecated typing generics."
"typing.Coroutine".msg = "Use collections.abc.Coroutine instead of deprecated typing generics."
"typing.Counter".msg = "Use collections.Counter instead of deprecated typing generics."
"typing.DefaultDict".msg = "Use collections.defaultdict instead of deprecated typing generics."
"typing.Deque".msg = "Use collections.deque instead of deprecated typing generics."
"typing.Dict".msg = "Use dict instead of deprecated typing generics."
"typing.FrozenSet".msg = "Use frozenset instead of deprecated typing generics."
"typing.Generator".msg = "Use collections.abc.Generator instead of deprecated typing generics."
"typing.ItemsView".msg = "Use collections.abc.ItemsView instead of deprecated typing generics."
"typing.Iterable".msg = "Use collections.abc.Iterable instead of deprecated typing generics."
"typing.Iterator".msg = "Use collections.abc.Iterator instead of deprecated typing generics."
"typing.KeysView".msg = "Use collections.abc.KeysView instead of deprecated typing generics."
"typing.List".msg = "Use list instead of deprecated typing generics."
"typing.Mapping".msg = "Use collections.abc.Mapping instead of deprecated typing generics."
"typing.Match".msg = "Use re.Match instead of deprecated typing generics."
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead of deprecated typing generics."
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead of deprecated typing generics."
"typing.MutableSet".msg = "Use collections.abc.MutableSet instead of deprecated typing generics."
"typing.OrderedDict".msg = "Use collections.OrderedDict instead of deprecated typing generics."
"typing.Pattern".msg = "Use re.Pattern instead of deprecated typing generics."
"typing.Reversible".msg = "Use collections.abc.Reversible instead of deprecated typing generics."
"typing.Sequence".msg = "Use collections.abc.Sequence instead of deprecated typing generics."
"typing.Set".msg = "Use set instead of deprecated typing generics."
"typing.Tuple".msg = "Use tuple instead of deprecated typing generics."
"typing.Type".msg = "Use type instead of deprecated typing generics."
"typing.ValuesView".msg = "Use collections.abc.ValuesView instead of deprecated typing generics."

[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"

[tool.ruff.lint.pydoclint]
# Concise one-line summaries are complete documentation for simple helpers;
# require explicit return, yield, and raise contracts for substantive docstrings.
ignore-one-line-docstrings = true
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pylint.main]
# Activate rules whose behaviour depends on the project's Python baseline.
py-version = "3.14"
# Expand directory targets like tests even when they are not packages.
recursive = true
# Match the project file-size ceiling enforced during review.
max-module-lines = 400

[tool.pylint.design]
# Keep function call surfaces small enough to understand without memorising
# positional argument order.
max-args = 4
# The Pylint gate complements Ruff's stricter PLR0914 threshold without forcing
# broad refactors while introducing the additional rule families below.
max-locals = 20
# Use Pylint's statement-count proxy for function length; Pylint 4 does not
# expose a distinct physical-lines-per-function option.
max-statements = 70
# Keep positional call surfaces aligned with Ruff's existing argument limit.
max-positional-arguments = 4

[tool.pylint."messages control"]
# Keep this Pylint pass focused on the explicitly selected messages.
disable = [
    "all",
]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[tool.interrogate]
# Corpus fixtures under tests/fixtures are test data, not documented code.
# Negative docstring fixtures (f-strings, concatenated strings) are intentionally
# undocumented, so exclude the fixture tree from docstring-coverage enforcement.
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
markers = [
    "act: integration tests that drive GitHub Actions via act",
    "slow: exercises that take longer or require heavyweight tooling",
]
# Scope the bare run to the application suite. `make test` and the coverage
# step both invoke `pytest` with no path, which would otherwise also discover
# `scripts/tests/`: the duplication-gate helper tests import the gate's
# PEP 723 dependencies (`cyclopts`, `tomlkit`) rather than the application's
# dev group, so collecting them fails every application run at import. They
# are a lane of their own, provisioned and run by `make duplication-test`,
# which names its files explicitly; a path argument overrides `testpaths`, so
# that lane is unaffected. Stated as the one place the suite lives rather than
# as an exclusion, since `norecursedirs` would replace pytest's own defaults
# rather than extend them.
testpaths = ["tests"]

# Settings for the pinned `nose` code-duplication detector, run by the
# `make duplication` gate that `make lint` invokes. Keep `version` in sync with
# NOSE_VERSION in the Makefile and CI; tests/test_toolchain_contract.py enforces
# the match.
#
# `roots` deliberately names only the maintained production Python package.
# `tests/` is excluded because a scan of it returns an order of magnitude more
# families (87 when this was written, against 4 for the package itself), almost
# all assertion-shape and fixture-setup repetition, which would dominate the
# ranked budget with test scaffolding. The figure is a measurement of one tree,
# not a constant: it read 82, 83, 85 and then 87 as this branch and its base
# moved, so the exclusion rests on the order-of-magnitude gap and the character
# of the duplication, not on the digit. `scripts/` is excluded so the gate's own
# helper modules are not self-referential; and the Rust workspace under
# `crates/` is covered by Clippy and Whitaker rather than by a Python clone
# detector.
#
# `min-size` counts nose intermediate-language (IL) tokens, not Python lines or
# AST nodes. `surface = "all"` is required: nose's curated default dashboard
# reports nothing here at all, while `all` reports 9 families. `top = 30` sits
# above the saturation point — the complete ranking is 9 families, so every one
# of them is adjudicated rather than truncated, and the gate's coverage of this
# package is total rather than merely the top 30. That saturation is a
# measurement of the present tree rather than a guarantee: if the package grows
# past 30 families the bound starts hiding some, and the surface should be
# re-measured before the "nothing is hidden" claim is repeated. The count has
# moved before: it stood at 4 until this branch was replayed onto main's
# safe-fix work, which added package code the earlier measurement predated.
[tool.nose]
version = "0.20.0"
roots = ["python/stilyagi"]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 30

# Reasoned exceptions for the duplication gate. Entries key on locations, not
# line spans: `path` (glob) matches any location in matching files, and
# `path::name` additionally requires nose's unit name. A `unit` entry names one
# key; a `members` entry names several. Either silences a family only when every
# location in it matches one of the entry's keys, so a new copy in an unlisted
# file still blocks. Record entries with
# `make duplication-allow FIRST=... [SECOND=...] REASON=...` and remove them
# when the gate reports them as stale.
#
# A `path::name` key never matches an unnamed location, and nose names a unit
# only when it matched a whole function, class, or method. A family reported
# at fragment level therefore has no narrower key than the whole file, and
# such an entry also silences any later fragment-level family in that file.
# Always prefer a `path::name` key when the detector does supply a name; the
# `discovery_targets.py` entry below is the one family so far that does.
[tool.duplication_gate]

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/config/resolve.py", "python/stilyagi/engine/extraction.py"]
reason = "Coincidental two-line guard shape in unrelated modules: one returns an empty tuple because the 'extend' key is unset, the other because no IR payload was supplied. Nothing is shared but the shape of the guard."

[[tool.duplication_gate.allow]]
unit = "python/stilyagi/config/validate.py"
reason = "Parallel element validators: one rejects a mapping's non-string keys, the other a tuple's non-string items, and each raises its own diagnostic. Sharing them would require a predicate-taking helper with a boolean mode, which the config layer deliberately avoids."

[[tool.duplication_gate.allow]]
unit = "python/stilyagi/engine/extraction.py"
reason = "Double-checked locking around one process-wide vocabulary validation. The unlocked pre-check and the locked re-check are the idiom itself; collapsing them into a helper would defeat the purpose, since the second read must happen under the lock."

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/discovery_targets.py::_prune_ignored_directories", "python/stilyagi/discovery_targets.py::_discover_directory_target"]
reason = "Membership test against the already-extracted _IGNORED_DIRECTORY_NAMES constant, reached from two independent phases: one decides whether a directory target should be walked at all before descending, the other filters names during the walk. Nose reports shared_lines and removable as 0, so nothing here is extractable; the constant is already the shared abstraction, and the only other candidate would be a boolean-mode predicate wrapper coupling a pre-walk gate to an in-walk filter."

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/engine/fix_pipeline.py::FixRequest", "python/stilyagi/engine/fix_pipeline.py::PlannedFile"]
reason = "Request and result are deliberate parallels with no shared behaviour. FixRequest carries planning inputs -- document, diagnostics, lint_config, level; PlannedFile carries planning outputs -- fixed_bytes, fix_errors, selected, and the counter fields. The six shared field annotations are just the file-level facts both sides have to name: bytes, text, two paths, syntax, and the stdin flag. A common base would assert an is-a relationship that is false and would drag planning inputs into the result type surface, coupling the two sides of the planner boundary so that neither could then evolve independently."

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/engine/fix_pipeline.py", "python/stilyagi/engine/fix_planning/plan.py"]
reason = "Two unrelated two-line guards that happen to read alike: patch_for returns the empty string because a patch with no hunks is not a patch, while _plan_outcome returns unchanged because that is the name of a planner terminal state. One vocabulary is the diff format and the other is the plan state enum, and the two sentinels are deliberately not interchangeable. The only extractable content is the guard itself, and a helper taking the sentinel as an argument would be a boolean-mode wrapper around an if statement. The same guard shape is already recorded as an exception between config/resolve.py and engine/extraction.py."

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/engine/extraction.py", "python/stilyagi/engine/renderers.py"]
reason = "Two unrelated serialization helpers guarding an optional input: _parse_ir_json returns None because the bridge field was absent, while _fix_payload returns None because the diagnostic carried no fix. One is a deserializer for the Rust bridge payload and the other is a JSON renderer for rule-authored fixes, so the shared content is only the two-line None guard. Extraction would couple a parse path to a render path that never exchange values."

[[tool.duplication_gate.allow]]
members = ["python/stilyagi/cli_apply.py", "python/stilyagi/engine/fix_planning/plan.py"]
reason = "The three shared lines are the PEP 484 conditional-import prologue for lazy annotations -- the TYPE_CHECKING guard, the cabc alias, and the blank line -- which 35 modules in python/stilyagi carry and which 19 bind cabc for. The module bodies beneath differ completely: one is fix application and the other is fix planning. There is nothing to extract, because the idiom is a language-level pattern each module must state for itself; a shared import module would make every module depend on it at runtime for a declaration that is, by construction, not evaluated at runtime."
[[tool.duplication_gate.allow]]
members = ["python/stilyagi/cli_fix.py", "python/stilyagi/engine/fix_pipeline.py", "python/stilyagi/check_inputs.py"]
reason = "The shared content is the two-line TYPE_CHECKING marker and a newline. cli_fix.py and fix_pipeline.py bind cabc under the guard, check_inputs.py binds pathlib instead, so even the guarded block contents do not agree. The marker appears in 35 modules across python/stilyagi and the entry is recorded per family only because nose ranks fragments; it is the PEP 484 idiom for lazy annotations, not a distinct abstraction, and no runtime helper can carry a compile-time-only declaration."

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# The gateway covers tests and scripts as well as the package, so the checker
# must see them. Excluded paths are build output and vendor trees only; the
# deliberate corpus fixtures under tests/fixtures are added below, because
# they are malformed on purpose and would otherwise report phantom errors.
include = ["python/stilyagi", "tests", "scripts", ".github"]
exclude = [
    "tests/fixtures",
    "build",
    "dist",
    ".venv",
    "target",
    "crates/stilyagi-pyext/target",
]
[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "python"

[tool.maturin]
manifest-path = "crates/stilyagi-pyext/Cargo.toml"
module-name = "stilyagi._stilyagi_rs"
python-source = "python"

[tool.skylos.gate]
strict = true

[tool.skylos.whitelist]
names = [
    "InvalidSpacyModelError",
    "_coerce_path",
    "_coerce_string_to_string_tuple_map",
    "_copy_mapping",
    "_require_strict_int",
    "reset_extraction_state_for_tests",
    "extract_document",
]

[tool.skylos.whitelist.documented]
InvalidSpacyModelError = "Raised by SpacyProviderConfig validation for blank model identifiers."
_coerce_path = "Called by StilyagiConfig post-initialization to normalize cache directories."
_coerce_string_to_string_tuple_map = "Called by LintConfig post-initialization to normalize per-file ignore mappings."
_copy_mapping = "Called by configuration dataclass post-initialization to copy reserved mappings."
_require_strict_int = "Called by StilyagiConfig post-initialization to validate the line-length setting."
reset_extraction_state_for_tests = "Called by extraction tests that reset process-wide bridge caches."
extract_document = "PyO3 exports this stubbed API; its signature parameters mirror the compiled extension."
[build-system]
# Keep in sync with [dependency-groups].dev.
requires = ["maturin==1.14.1"]
build-backend = "maturin"
