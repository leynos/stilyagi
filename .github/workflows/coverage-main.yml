name: Coverage (main)

# The single publisher. CodeScene accepts `cs-coverage upload` only for
# analysed branches, and this workflow is the one place in the
# repository that runs a CodeScene action at all: no workflow serving
# pull requests names one, receives `CS_ACCESS_TOKEN`, or invokes
# `cs-coverage`.
#
# That is a policy rather than a gap. A pull request from a fork cannot
# read the token, so the check there was a silent skip for exactly the
# contributions least likely to have been measured; and on a branch it
# put a second tool on the critical path for a gate the ratchet already
# applies. `make test-workflow-contracts` holds the shape.
#
# This workflow also advances the coverage ratchet baseline: caches
# saved on main are readable by every pull-request run, so the baseline
# written here is the one every pull request's ratchet compares
# against. smoke.yml's generate-coverage selection therefore has to
# match the one below field for field.
#
# workflow_dispatch lets the upload be re-run on demand: merges performed
# by the automerge workflow's GITHUB_TOKEN do not fire push-event
# workflows at all, so automerged changes to main only get coverage via
# a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run at a time, and a superseded one queues rather than
# being cancelled. The baseline this workflow writes is the one every
# pull request ratchets against, so two runs racing would decide it by
# which finished last. A cancelled run abandons both its upload and its
# baseline write; a queued one publishes later, and the later push's
# baseline still wins because it runs last.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: debug
  # See smoke.yml for why the coverage run needs extra wall-clock
  # headroom under cold instrumentation (trybuild-heavy suite, maturin
  # extension build).
  RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'

jobs:
  coverage-upload:
    # Ubicloud's cache proxy is scoped by ref, so a pull request's Ubicloud
    # lint-test reads a warm main scope only if a main job on Ubicloud writes
    # it. This is a main writer. The fork arm never applies on push or
    # dispatch; it is kept so every Ubicloud lane reads the same way.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    # Kept in step with smoke.yml's coverage lane: above the 1,800 s cargo
    # watchdog plus the work either side. This job's own worst was 98 s
    # outside the watchdog, on run 32946918439.
    #
    # "Outside the watchdog" means every second the cargo watchdog does
    # not bound, which is the whole job less the Generate coverage step
    # that runs cargo. The CodeScene upload and the post steps are
    # outside it, and counting them as inside gives 84 s for this run
    # and understates what the ceiling has to cover. The contract in
    # tests/test_timeout_ordering_contract.py reads it the same way.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@c4ed5ffaf0640b1907d5359a87fd1677034eec27

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      - name: Generate coverage
        # The selection here is the baseline every pull request's ratchet
        # is measured against, so smoke.yml's must match it field for
        # field.
        uses: leynos/shared-actions/.github/actions/generate-coverage@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          pytest-workers: ''

      # Publishes whether the token exists, and nothing else. The token
      # stays out of every `env` on this job: the upload is a composite
      # action, and a composite action's nested steps inherit the calling
      # step's environment, so a token bound there reaches every one of
      # them. GitHub evaluates the expression before the shell starts, so
      # the token enters no process.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref as well as the token. `workflow_dispatch` is offered
        # above so an automerged change to main can be measured on
        # demand, and a dispatch can be aimed at any branch: without
        # this guard, dispatching from a feature branch uploads that
        # branch's coverage as the trunk's, and every pull request then
        # ratchets against it. CodeScene has no way to tell it was not
        # main, because the upload does not carry the ref.
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          format: cobertura
          # Named rather than left to the default, because this is the
          # one workflow allowed to upload and the reader of these lines
          # should not have to look the default up to know that.
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          # No checksum input. `installer-checksum` is rejected outright
          # when non-empty from this pin, and `archive-checksum` digests
          # the manifest archive rather than the installer script that
          # the old `CODESCENE_CLI_SHA256` variable holds, so carrying
          # the value across under the new name would fail every run.
          # The action pins cs-coverage through its own manifest now,
          # which is what that variable was standing in for.
