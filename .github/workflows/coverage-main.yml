name: Coverage (main)

# The single publisher. CodeScene accepts `cs-coverage upload` only for
# analysed branches, and this workflow is the one place in the
# repository that runs a CodeScene action at all: no workflow serving
# pull requests names one, receives `CS_ACCESS_TOKEN`, or invokes
# `cs-coverage`.
#
# That is a policy rather than a gap. A pull request from a fork cannot
# read the token, so the check there was a silent skip for exactly the
# contributions least likely to have been measured; and on a branch it
# put a second tool on the critical path for a gate the ratchet already
# applies. `make test-workflow-contracts` holds the shape.
#
# This workflow also advances the coverage ratchet baseline: caches
# saved on main are readable by every pull-request run, so the baseline
# written here is the one every pull request's ratchet compares
# against. smoke.yml's generate-coverage selection therefore has to
# match the one below field for field.
#
# workflow_dispatch lets the upload be re-run on demand: merges performed
# by the automerge workflow's GITHUB_TOKEN do not fire push-event
# workflows at all, so automerged changes to main only get coverage via
# a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run at a time, and a superseded one queues rather than
# being cancelled. The baseline this workflow writes is the one every
# pull request ratchets against, so two runs racing would decide it by
# which finished last. A cancelled run abandons both its upload and its
# baseline write; a queued one publishes later, and the later push's
# baseline still wins because it runs last.
concurrency:
  # The estate's canonical workflow-and-ref group. Keying on the ref alone
  # keeps every run for main in one queue, while naming the group after the
  # workflow keeps a rename from needing a matching edit here.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: debug
  # See smoke.yml: the 56-minute Nextest budget, termination allowance and
  # cold build need headroom under the shared-actions cargo wall-clock cap.
  RUN_RUST_CARGO_WAIT_TIMEOUT: '4080'

jobs:
  coverage-upload:
    name: coverage-upload
    # Main-only: no pull request can start this workflow, so it needs no fork
    # fallback arm. This job measures and uploads on a GitHub-hosted runner,
    # with no compiler cache (a hosted runner's sccache reaches only GitHub's
    # store, which no Ubicloud lane reads). The two Ubicloud jobs below carry
    # what the Ubicloud pull-request lane reads from main.
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    # Kept in step with smoke.yml's coverage lane: above the 4,080 s cargo
    # watchdog plus the work either side. This job's own worst was 98 s
    # outside the watchdog, on run 32946918439.
    #
    # "Outside the watchdog" means every second the cargo watchdog does
    # not bound, which is the whole job less the Generate coverage step
    # that runs cargo. The CodeScene upload and the post steps are
    # outside it, and counting them as inside gives 84 s for this run
    # and understates what the ceiling has to cover. The contract in
    # tests/test_timeout_ordering_contract.py reads it the same way.
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6f53870bc36cfac0c0c9893daaee77a5eb4327f4
        with:
          use-sccache: 'false'
          save-cache: 'false'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@6f53870bc36cfac0c0c9893daaee77a5eb4327f4

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      - name: Install the build standard
        # The measured build excludes mold: CI's exported `-D warnings`
        # displaces the development flags, and the coverage route keeps
        # instrumentation only. The suite it runs still drives Make targets
        # that run `make check-build-tools`, which refuses to continue without
        # the pinned mold and nightly toolchain, so the publisher installs them
        # itself. tests/test_build_tools_wiring.py holds the step unconditional
        # and ahead of the coverage action.
        run: make install-build-tools

      - name: Generate coverage
        # The selection here is the baseline every pull request's ratchet
        # is measured against, so smoke.yml's must match it field for
        # field.
        # The coverage route, which excludes the development standard. An
        # assigned `RUSTFLAGS` displaces `.cargo/config.toml`'s `-Zthreads=8`
        # and mold, and instrumentation is added on top of it; the action
        # itself selects LLVM over the dev profile's Cranelift. setup-rust
        # exports the same value job-wide, but the exclusion is stated here so
        # it does not hang on that default. tests/test_build_standard_exclusions.py
        # holds the value free of development flags.
        env:
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@6f53870bc36cfac0c0c9893daaee77a5eb4327f4
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # `coverage-baseline` saves the baseline on Ubicloud, where the
          # pull-request lane reads it: this hosted job cannot write that
          # store, so it hands the measured figures over as an artefact.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
          pytest-workers: ''

      # Publishes whether the token exists, and nothing else. The token
      # stays out of every `env` on this job: the upload is a composite
      # action, and a composite action's nested steps inherit the calling
      # step's environment, so a token bound there reaches every one of
      # them. GitHub evaluates the expression before the shell starts, so
      # the token enters no process.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref as well as the token. `workflow_dispatch` is offered
        # above so an automerged change to main can be measured on
        # demand, and a dispatch can be aimed at any branch: without
        # this guard, dispatching from a feature branch uploads that
        # branch's coverage as the trunk's, and every pull request then
        # ratchets against it. CodeScene has no way to tell it was not
        # main, because the upload does not carry the ref.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@6f53870bc36cfac0c0c9893daaee77a5eb4327f4
        with:
          format: cobertura
          # Named rather than left to the default, because this is the
          # one workflow allowed to upload and the reader of these lines
          # should not have to look the default up to know that.
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          # No checksum input. `installer-checksum` is rejected outright
          # when non-empty from this pin, and `archive-checksum` digests
          # the manifest archive rather than the installer script that
          # the old `CODESCENE_CLI_SHA256` variable holds, so carrying
          # the value across under the new name would fail every run.
          # The action pins cs-coverage through its own manifest now,
          # which is what that variable was standing in for.

  coverage-baseline:
    name: coverage-baseline
    # Saves the ratchet baseline the measuring job hands over, into the store
    # the Ubicloud pull-request lane reads. It does no compiling. The action
    # publishes only on a push to `main`.
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@6f53870bc36cfac0c0c9893daaee77a5eb4327f4
        with:
          artefact-name: coverage-baseline-handover

  coverage-warmup:
    name: coverage-warmup
    # Build-only: compiles the pull-request lane's instrumented test binaries
    # so their compiler-cache entries sit in main's Ubicloud scope, which a
    # pull request reads only if a main job on Ubicloud writes it. It runs no
    # test and uploads nothing.
    runs-on: ubicloud-standard-4
    # This job invokes the coverage action, so it inherits the 4,080 s
    # watchdog above and its ceiling has to contain that plus the work
    # either side; see the note on `coverage-upload`.
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6f53870bc36cfac0c0c9893daaee77a5eb4327f4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install the build standard
        run: make install-build-tools

      - name: Compile the instrumented tests
        # The same flags as smoke.yml's coverage step, so the cache entries
        # written here are the ones the pull-request lane reads.
        env:
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@6f53870bc36cfac0c0c9893daaee77a5eb4327f4
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          build-only: 'true'
