name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
#
# No build-tools install: cargo-mutants runs `cargo test` and no Make goal, so
# it never reaches `make check-build-tools`. The shared workflow's setup-rust
# exports `-D warnings`, which displaces the development flags (and so mold),
# and the Cranelift component arrives with the toolchain pinned in
# rust-toolchain.toml. tests/test_build_tools_wiring.py classifies this call.
on:
  schedule:
    - cron: "50 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-rust:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@7d751eded578e48dacf43ab173d5820e6437c474
    with:
      paths: "crates/"
      exclude-globs: "crates/stilyagi-test-fixtures/**,crates/stilyagi-test-support/**"
      extra-args: "--all-features --test-workspace=true"
