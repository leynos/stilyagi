---
# Publish one tag: every native wheel and the one source distribution, to PyPI
# and to the tag's GitHub Release, with the same bytes in both places.
#
# The workflow is safe to re-run. A re-pushed tag rebuilds every artefact, and
# rebuilt wheels are rarely byte-identical, so each filename's canonical bytes
# are the ones already published: PyPI's first, then an existing asset on the
# tag's GitHub Release, and this run's freshly built and attested file only
# when neither destination has the name. Each destination receives only the
# names it lacks, nothing is overwritten, and the release stays a draft until
# both hold the same digests. The decisions live in `scripts/release_assets.py`;
# every network call stays in these steps' `curl` and `gh` invocations.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  # Queue rather than cancel. A re-pushed tag that cancelled the running
  # release could stop it part-way through an upload. The queued run then
  # starts from a complete state, and the reconciliation below makes it safe
  # to repeat.
  cancel-in-progress: false
  # GitHub keeps one pending run per group by default, so a third push would
  # silently replace the second. `max` keeps every queued run instead.
  #
  # actionlint 1.7.12, the latest release, does not yet know this key and
  # reports `unexpected key "queue"`. GitHub documents it and validates it, and
  # the parser fix is still open upstream (rhysd/actionlint#657, PR #661), so
  # the lint error is the checker lagging, not this file.
  queue: max

# Every job declares exactly what it needs, so nothing inherits a write scope.
permissions: {}

jobs:
  # Runs beside the build rather than before it, so the paid build lane never
  # queues behind a hosted job; every job that attests, uploads, or releases
  # waits on it instead. The tag loses its `v` and is compared with the
  # manifests as a string in both checks, so `v0.2.0-beta1` matches
  # `0.2.0-beta1` and any other spelling fails.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.cargo-version.outputs.version }}
      prerelease: ${{ steps.pyproject-version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The reconciliation scripts use Python 3.14 syntax (PEP 649 deferred
      # annotations), and ubuntu-latest's default python3 is 3.12, so the
      # interpreter is pinned rather than inherited from the image.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6.3.0
        with:
          python-version: "3.14"

      # Pinned to the shared-actions commit this repository's other calls use,
      # so one bump moves every shared action together.
      - name: Check the Cargo manifest version against the tag
        id: cargo-version
        uses: leynos/shared-actions/.github/actions/ensure-cargo-version@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          manifests: crates/stilyagi-pyext/Cargo.toml

      # The shared pyproject.toml validator exists only inside the reusable
      # publishing workflow, which also publishes, so the script repeats it.
      # The step's output is the pre-release flag the GitHub Release needs.
      - name: Check the pyproject.toml version against the tag
        id: pyproject-version
        env:
          TAG_VERSION: ${{ steps.cargo-version.outputs.version }}
        run: python3 -m scripts.release_version

  build-wheels:
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheels.yml

  # Attests exactly the files this run built, before anything leaves the run,
  # and hands them on as one artefact. Bytes a later job carries over from an
  # earlier run were attested by that run; every run's attestation stays in
  # the repository's attestation store, and its bundle is kept under a
  # run-unique name so no release asset is ever overwritten.
  attest:
    needs:
      - check-version
      - build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # The reconciliation scripts use Python 3.14 syntax (PEP 649 deferred
      # annotations), and ubuntu-latest's default python3 is 3.12, so the
      # interpreter is pinned rather than inherited from the image.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6.3.0
        with:
          python-version: "3.14"

      # The wheels and the sdist are uploaded under different names: the wheels
      # per platform as `wheels-*`, the one source distribution as `sdist`.
      # Both downloads are required, or the cardinality guard below finds no
      # archive and every tag fails before anything is attested.
      - name: Download the native wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist

      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/sdist

      - name: Collect release artefacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/publish
          find dist -path dist/publish -prune -o -type f \
            \( -name "*.whl" -o -name "*.tar.gz" \) -print0 |
            xargs -0 -r -I {} cp {} dist/publish/
          shopt -s nullglob
          sdists=(dist/publish/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one source distribution." >&2
            ls -al dist/publish >&2
            exit 1
          fi

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*

      # The bundle's name carries the run and its attempt, so a re-run adds a
      # record instead of colliding with the one the first run published.
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          bundle="stilyagi-${GITHUB_REF_NAME}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${BUNDLE_PATH}" "dist/attestations/${bundle}.sigstore.json"

      - name: Hand the artefacts to the publishing jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          if-no-files-found: error

  # Creates or reuses the draft and snapshots its assets, so the PyPI job can
  # carry GitHub's bytes over without a GitHub token of its own. A draft is
  # visible only to a token that can write contents.
  draft-release:
    needs:
      - check-version
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # The reconciliation scripts use Python 3.14 syntax (PEP 649 deferred
      # annotations), and ubuntu-latest's default python3 is 3.12, so the
      # interpreter is pinned rather than inherited from the image.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6.3.0
        with:
          python-version: "3.14"

      - name: Download the release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Create or reuse the draft release
        id: create
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run reuses whatever release the tag already has, draft or not.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Reusing the existing release for ${GITHUB_REF_NAME}."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${IS_PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"

      - name: Snapshot the release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          gh release view "${GITHUB_REF_NAME}" --json assets > github-state/assets.json
          PYTHONPATH=scripts python3 -m release_assets_cli carryover --publish dist/publish \
            --assets github-state/assets.json > github-state/carryover.txt
          while IFS= read -r name; do
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt

      # An asset the Release already holds is carried to PyPI, so its bytes
      # must be shown to have been built by this repository's release workflow
      # for this tag. The tag is pinned rather than the commit: a re-pushed tag
      # legitimately carries bytes built at an older commit, and the
      # attestation records which one, so the record kept here is the audit
      # trail for it.
      - name: Verify the carried assets' provenance
        id: carried
        run: |
          set -euo pipefail
          mkdir -p github-state/provenance
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            gh attestation verify "github-state/files/${name}" \
              --repo "${GH_REPO}" \
              --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              --format json > "github-state/provenance/${name}.json"
          done < github-state/carryover.txt

      - name: Hand the release state to the publishing jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-github-state
          path: github-state
          if-no-files-found: error

  publish-pypi:
    needs:
      - attest
      - draft-release
    # Release orchestration: it uploads the artefacts other jobs built. No
    # build work, so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/stilyagi/
    permissions:
      contents: read
      id-token: write
    outputs:
      # Whether this run put anything on PyPI. `publish-release` needs it to
      # tell a new artefact (absent from an index read before the upload) from
      # a stale index (absent from an index read after it), which decides
      # whether local bytes may stand in for PyPI's.
      uploaded: ${{ steps.pending.outputs.remaining }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # The reconciliation scripts use Python 3.14 syntax (PEP 649 deferred
      # annotations), and ubuntu-latest's default python3 is 3.12, so the
      # interpreter is pinned rather than inherited from the image.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6.3.0
        with:
          python-version: "3.14"

      - name: Download the release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Download the release state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state

      # `publish-release` repeats this script. The runner's curl cannot report
      # `%{num_retries}`, so the loop retries a network error, 429, or 5xx
      # itself. A 404 is an empty index: a first release has no project page
      # yet. Every other non-200 fails, so a 403 from a proxy is not mistaken
      # for "nothing published".
      - name: Fetch the PyPI index
        id: index
        run: &fetch-index |
          set -euo pipefail
          attempt=0
          status=000
          while [ "${attempt}" -lt 6 ]; do
            attempt=$((attempt + 1))
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output pypi-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://pypi.org/simple/stilyagi/) || status=000
            case "${status}" in
              000|429|5??) [ "${attempt}" -lt 6 ] && sleep 2 ;;
              *) break ;;
            esac
          done
          printf 'attempts=%s\nstatus=%s\n' "${attempt}" "${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            200) ;;
            404) echo '{"files": []}' > pypi-index.json ;;
            *)
              echo "PyPI simple index returned HTTP ${status}." >&2
              exit 1
              ;;
          esac

      # PyPI rejects a second upload of an existing filename, so names it holds
      # are dropped, and a name only the GitHub Release holds is sent with
      # GitHub's bytes rather than this run's rebuild.
      - name: Skip artefacts already on PyPI
        id: pending
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m release_assets_cli stage-pypi --publish dist/publish \
            --index pypi-index.json --assets github-state/assets.json \
            --github-files github-state/files \
            --provenance github-state/provenance

      # pypa's action rather than `uv publish`: with Trusted Publishing it also
      # signs and uploads a PEP 740 attestation for every file, which uv does
      # not. `skip-existing` takes the place of uv's `--check-url`, so a file
      # an interrupted earlier attempt already uploaded is skipped, not fatal.
      - name: Publish to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/publish/
          skip-existing: true

  # Runs only once PyPI holds every artefact, so the release's missing assets
  # take PyPI's bytes, and the release stays a draft unless both destinations
  # then agree.
  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    # `publish-pypi` reports whether it uploaded, which decides whether an
    # artefact the index omits may be filled from this run's rebuild.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # The reconciliation scripts use Python 3.14 syntax (PEP 649 deferred
      # annotations), and ubuntu-latest's default python3 is 3.12, so the
      # interpreter is pinned rather than inherited from the image.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6.3.0
        with:
          python-version: "3.14"

      - name: Download the release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Fetch the PyPI index
        id: index
        run: *fetch-index

      - name: List the release assets
        id: assets
        run: gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json

      - name: Stage the assets the release lacks
        id: stage
        env:
          PYPI_PUBLISHED: ${{ needs.publish-pypi.outputs.uploaded }}
        run: |
          set -euo pipefail
          # A run that published has just changed PyPI, and PyPI's index is
          # cached, so a name it omits now is a stale read. Staging refuses
          # that rather than filling the gap with this run's rebuild, whose
          # bytes need not equal the ones PyPI accepted.
          published=""
          if [ "${PYPI_PUBLISHED:-}" = "true" ]; then
            published="--pypi-published"
          fi
          PYTHONPATH=scripts python3 -m release_assets_cli stage-github --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations --output github-upload \
            ${published:+"${published}"} > pypi-fetch.tsv
          while IFS=$'\t' read -r name url; do
            curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"
          done < pypi-fetch.tsv

      - name: Check the fetched PyPI bytes
        id: fetched
        run: |
          PYTHONPATH=scripts python3 -m release_assets_cli check-fetched --publish dist/publish \
            --index pypi-index.json --assets release-assets.json --output github-upload

      # Every file about to be attached must be covered by a verified
      # attestation, whether this run built it or an earlier run of the tag
      # did. The commit is deliberately not pinned here: a carried file was
      # built at whatever commit that earlier run saw, and its attestation
      # records which one. `check-provenance` requires that record to name a
      # source commit, so an unattributed build cannot reach the Release.
      - name: Verify the upload set's provenance
        id: provenance
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p provenance
          for file in github-upload/*; do
            name="$(basename "${file}")"
            case "${name}" in *.sigstore.json) continue ;; esac
            gh attestation verify "${file}" \
              --repo "${GH_REPO}" \
              --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              --format json > "provenance/${name}.json"
          done
          PYTHONPATH=scripts python3 -m release_assets_cli check-provenance \
            --publish dist/publish --assets release-assets.json \
            --output github-upload --provenance provenance

      # No `--clobber`: an asset the release already holds is canonical.
      - name: Upload the assets the release lacks
        id: upload
        if: steps.stage.outputs.pending == 'true'
        run: gh release upload "${GITHUB_REF_NAME}" github-upload/*

      # The bundle beside the assets is what a consumer can check, so it is
      # read as a consumer would: listed from the Release as it now stands,
      # downloaded, decoded, and compared against the Release's own asset
      # digests. A Release that carries no attestation covering everything in
      # it is not published, whichever run attached the parts.
      - name: Check the Release's assets are attested
        id: attested
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          mkdir -p release-bundles
          PYTHONPATH=scripts python3 -m release_assets_cli bundles \
            --publish dist/publish --assets release-assets.json > release-bundles.txt
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir release-bundles
          done < release-bundles.txt
          PYTHONPATH=scripts python3 -m release_assets_cli check-bundle \
            --publish dist/publish --assets release-assets.json \
            --provenance release-bundles

      - name: Check both destinations hold the same bytes
        id: verify
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          PYTHONPATH=scripts python3 -m release_assets_cli verify --publish dist/publish \
            --index pypi-index.json --assets release-assets.json

      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false \
            --prerelease="${IS_PRERELEASE}"
