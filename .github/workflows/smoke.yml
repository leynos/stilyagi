name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

# A second push to a pull request supersedes the run already in flight, which
# otherwise charges a full set of minutes for a result nobody reads. Pushes to
# main, dispatches and schedules share the group and are never cancelled: they
# are the cache writers and the published record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: debug
  RUFF_VERSION: '0.16.4'
  TY_VERSION: '0.0.74'
  MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
  MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
  # The 927edd4 shared-actions pin adds a 600s cargo wall-clock cap;
  # stilyagi's trybuild-heavy suite and the maturin extension build need
  # more headroom under cold coverage instrumentation.
  RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'

jobs:
  lint-test:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. A push
    # to main runs here too, so main writes the Ubicloud cache scope this
    # reads; coverage-main.yml's coverage-upload is on the same class.
    # standard-4, not standard-2: standard-2 runs took 12.4 and 13.5 min against
    # a hosted median of 6.3 (runs 36599858297 and 36601811696, the same lane on standard-2).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    # Above the 1,800 s cargo watchdog on the coverage step plus the work
    # either side of it, which reached 541 s on run 34069884428, counting
    # every second the watchdog does not bound rather than the coverage
    # steps as a group; the narrower reading gives 526 s and understates
    # what the ceiling has to cover. This job
    # had no ceiling before and so inherited GitHub's six-hour default; a
    # ceiling merely above the watchdog would cancel the job before the
    # watchdog could report an overrun, and a cancellation discards the
    # log that would have explained it.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The coverage ratchet compares this commit against the
          # baseline main published, so the merge base has to be
          # reachable. A shallow checkout leaves the comparison with
          # nothing to compare against.
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@c4ed5ffaf0640b1907d5359a87fd1677034eec27

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Install test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-nextest@0.9.138

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Install Nixie
        run: |
          uv tool install nixie-cli==1.0.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Spelling
        # The action above covers the lint half of `make markdownlint`; this
        # step keeps its en-GB-oxendict spelling half in CI.
        run: make spelling

      - name: Mermaid lint
        run: make nixie


      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          cranelift: true

      - name: Typecheck
        run: make typecheck

      - name: Lint and dead-code detection
        run: make lint

      # The docstring examples only. The coverage step below, and
      # coverage-main.yml on a push, run the Rust and Python suites, and the
      # steps above run the format check and Clippy, so `make test` here ran
      # all of that a second time. tests/test_suite_runs_once.py holds it.
      - name: Docstring examples
        run: make test-doc

      - name: Generate coverage
        # Coverage is generated on pull requests only: coverage-main.yml
        # regenerates and uploads it on every push to main, and running
        # both here would duplicate the work (and, once ratcheted, the
        # baseline write).
        #
        # The ratchet is the whole of the coverage gate on this lane.
        # It compares against the baseline coverage-main.yml writes, so
        # the selection here has to match that publisher's exactly:
        # a different format, runner or feature set produces a report
        # that is not comparable with the baseline, and the comparison
        # then measures the difference between the two runs rather than
        # the difference between the two commits.
        #
        # No CodeScene step follows. This workflow serves pull requests,
        # and CV-005 puts the upload and the changed-line check on the
        # main publisher alone: a pull request from a fork has no
        # `CS_ACCESS_TOKEN` and the step degraded to a silent skip, while
        # for a branch it added a whole second tool to the critical path
        # for a gate the ratchet already applies.
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # This job publishes nothing. coverage-main.yml owns the
          # artefact, and two uploads of the same name from two lanes is
          # a race whose winner depends on which finished last.
          publish-artefact: 'false'
          pytest-workers: ''

  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@c4ed5ffaf0640b1907d5359a87fd1677034eec27

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Release smoke
        run: make release
