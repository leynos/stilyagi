name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: debug
  WHITAKER_INSTALLER_VERSION: '0.2.5'
  # The 927edd4 shared-actions pin adds a 600s cargo wall-clock cap;
  # stilyagi's trybuild-heavy suite and the maturin extension build need
  # more headroom under cold coverage instrumentation.
  RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Coverage generation on pull requests needs the merge base
          # reachable for a future `cs-coverage check` gate (see the
          # deferred-gate note on the coverage step below).
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@927edd45ae77be4251a8a18ca9eb5613a2e32cbd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install test runner
        run: cargo binstall --no-confirm cargo-nextest@0.9.138

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Install Markdownlint CLI
        run: |
          bun install --no-progress --global markdownlint-cli2

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Install Nixie
        run: |
          uv tool install nixie-cli==1.0.0

      - name: Check formatting
        run: make check-fmt

      - name: Markdown lint
        run: make markdownlint

      - name: Mermaid lint
        run: make nixie

      - name: Cache Whitaker installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}

      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer --cranelift

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Generate coverage
        # Coverage is generated on pull requests only: coverage-main.yml
        # regenerates and uploads it on every push to main, and running
        # both here would duplicate the work (and, once ratcheted, the
        # baseline write).
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@927edd45ae77be4251a8a18ca9eb5613a2e32cbd
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          pytest-workers: ''
      # The `mode: check` step is deliberately not wired in yet: CodeScene
      # project 74422 has no coverage-gates configuration, so
      # `cs-coverage check` fails every run with "HTTP call succeeded,
      # but the received project-config isn't valid. Lacks the gates
      # configuration." — a CodeScene-side per-project setting, not a CI
      # defect (see leynos/ddlint#287 and leynos/chutoro#156 for the same
      # failure on other projects). Add the check step in a fast-follow
      # PR once coverage-main.yml has uploaded to main at least once and
      # the gate is confirmed to resolve, or once CodeScene confirms the
      # project's coverage gate is enabled.

  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@927edd45ae77be4251a8a18ca9eb5613a2e32cbd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Release smoke
        run: make release
