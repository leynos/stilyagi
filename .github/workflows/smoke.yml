name: Smoke

on:
  pull_request:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install documentation tools
        run: |
          python -m pip install mdformat-all
          npm install -g markdownlint-cli2
          cargo install nixie whitaker --locked

      - name: Check formatting
        run: make check-fmt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build and smoke-test release artifact
        run: make release
