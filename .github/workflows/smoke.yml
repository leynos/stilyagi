name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install support tools
        run: |
          npm install -g markdownlint-cli2
          cargo install nixie whitaker-installer --locked
          whitaker-installer

      - name: Check formatting
        run: make check-fmt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build and smoke-test release artifact
        run: make release
