name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

# A second push to a pull request supersedes the run already in flight, which
# otherwise charges a full set of minutes for a result nobody reads. Pushes to
# main, dispatches and schedules share the group and are never cancelled: they
# are the cache writers and the published record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: debug
  RUFF_VERSION: '0.16.4'
  TY_VERSION: '0.0.74'
  WHITAKER_INSTALLER_VERSION: '0.2.6'
  MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
  MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
  # The 927edd4 shared-actions pin adds a 600s cargo wall-clock cap;
  # stilyagi's trybuild-heavy suite and the maturin extension build need
  # more headroom under cold coverage instrumentation.
  RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The coverage ratchet compares this commit against the
          # baseline main published, so the merge base has to be
          # reachable. A shallow checkout leaves the comparison with
          # nothing to compare against.
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install test runner
        run: cargo binstall --no-confirm cargo-nextest@0.9.138

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Install Nixie
        run: |
          uv tool install nixie-cli==1.0.0

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Spelling
        # The action above covers the lint half of `make markdownlint`; this
        # step keeps its en-GB-oxendict spelling half in CI.
        run: make spelling

      - name: Mermaid lint
        run: make nixie

      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}

      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer --cranelift

      - name: Typecheck
        run: make typecheck

      - name: Lint and dead-code detection
        run: make lint

      - name: Test
        run: make test

      - name: Generate coverage
        # Coverage is generated on pull requests only: coverage-main.yml
        # regenerates and uploads it on every push to main, and running
        # both here would duplicate the work (and, once ratcheted, the
        # baseline write).
        #
        # The ratchet is the whole of the coverage gate on this lane.
        # It compares against the baseline coverage-main.yml writes, so
        # the selection here has to match that publisher's exactly:
        # a different format, runner or feature set produces a report
        # that is not comparable with the baseline, and the comparison
        # then measures the difference between the two runs rather than
        # the difference between the two commits.
        #
        # No CodeScene step follows. This workflow serves pull requests,
        # and CV-005 puts the upload and the changed-line check on the
        # main publisher alone: a pull request from a fork has no
        # `CS_ACCESS_TOKEN` and the step degraded to a silent skip, while
        # for a branch it added a whole second tool to the critical path
        # for a gate the ratchet already applies.
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: coverage.xml
          format: cobertura
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # This job publishes nothing. coverage-main.yml owns the
          # artefact, and two uploads of the same name from two lanes is
          # a race whose winner depends on which finished last.
          publish-artefact: 'false'
          pytest-workers: ''

  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Release smoke
        run: make release
