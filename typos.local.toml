# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  'rust-analyzer',
  'release-artifact',
  '## Artifacts and notes',
  # Inline code spans are masked; the shared dictionary does not mask them yet.
  '`[^`\n]+`',
]

[files]
exclude = [
  "tests/fixtures",
]
