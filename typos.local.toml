# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "astroid",
  "inventario",
  "mis",
]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  'rust-analyzer',
  'release-artifact',
  '## Artifacts and notes',
  'Center \| Microsoft Learn',
]

[files]
exclude = [
  "tests/fixtures",
]
